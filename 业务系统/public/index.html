<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b4941">
  <title>校园流转 · 校园闲置交易</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#app">跳至主要内容</a>
  <aside class="sidebar" aria-label="应用导航">
    <a class="brand" href="#market"><span class="brand-mark" aria-hidden="true">↗</span><span>校园流转<small>CAMPUS CIRCULAR</small></span></a>
    <div class="navlabel">校园生活 · 循环有序</div>
    <nav aria-label="主导航">
      <button data-page="market"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>发现闲置</button>
      <button data-page="publish"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>发布物品</button>
      <button data-page="mine"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>我的发布</button>
      <button data-page="favorites"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20.5 4.7 13.2a5 5 0 0 1 7.1-7.1l.2.2.2-.2a5 5 0 0 1 7.1 7.1Z"/></svg>我的收藏</button>
      <button data-page="orders"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg>交易订单</button>
      <button data-page="messages"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 11a8 8 0 0 1-8 8H7l-4 3V11a9 9 0 0 1 18 0Z"/><path d="M7 10h10M7 14h6"/></svg>私信<span id="messageUnread" class="unread-count" hidden></span></button>
      <button data-page="notifications"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/></svg>站内通知</button>
      <button data-page="admin" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>管理工作台</button>
    </nav>
    <div class="asidebottom"><strong>好物再流转，校园更轻盈。</strong><p>出售 · 免费转让 · 以物易物</p><span class="version">业务系统 v0.2</span></div>
  </aside>
  <main>
    <header class="topbar"><div class="context"><span class="status-dot" aria-hidden="true"></span>校园物品流转<span class="context-detail"> / 本校学生交易平台</span></div><div id="account" aria-label="账号信息"></div></header>
    <div class="prototype"><span class="info-icon" aria-hidden="true">i</span><div><strong>线上约定，线下交付</strong><span>平台记录交易进度，双方自行处理资金。</span></div><span class="build-label">开发版本</span></div>
    <div id="app" tabindex="-1" aria-busy="true"></div>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
